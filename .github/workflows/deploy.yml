name: Build and Deploy Angular App

on:
  push:
    branches:
      - master

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm ci

    - name: Run Tests
      run: npx ng test --watch=false --browsers=ChromeHeadless

    - name: Configure npm Authentication
      run: echo "//registry.npmjs.org/:_authToken=${{ secrets.GITHUB_TOKEN }}" > ~/.npmrc

    - name: Build Project
      run: npm run deploy

    - name: Write runtime app config
      env:
        CLEANING_SCHEDULE_API_KEY: ${{ secrets.CLEANING_SCHEDULE_API_KEY }}
      run: |
        node -e "const fs=require('fs'); const key=(process.env.CLEANING_SCHEDULE_API_KEY||'').trim(); if(!key){throw new Error('Missing required secret: CLEANING_SCHEDULE_API_KEY');} const config={apiKey:key}; fs.writeFileSync('./dist/cleaning-schedule/browser/app-config.js', 'window.__APP_CONFIG__ = ' + JSON.stringify(config, null, 2) + ';\n');"

    - name: Add CNAME
      run: |
        cp CNAME ./dist/cleaning-schedule/browser/CNAME

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./dist/cleaning-schedule/browser 
